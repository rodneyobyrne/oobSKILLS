# Validate every proposed release and deploy the same tested artifact to GitHub Pages.
name: Validate and deploy static content to Pages

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      SITE_RELEASE_VERSION: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - name: Build and validate public artifact
        run: npm run validate
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser journeys
        run: npm run test:browser
      - name: Verify homepage release assets
        run: |
          file _site/images/ai-relationship/oob-ai-hero.png | grep -F "PNG image data"
          grep -F 'src="/images/ai-relationship/oob-ai-hero.png"' _site/index.html
          grep -F "/home-ai-cards-v3.css?v=${GITHUB_SHA}" _site/index.html
          ! grep -F 'oob-ai-hero-animated.svg' _site/index.html
      - name: Upload tested Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: "pages"
      cancel-in-progress: false
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
