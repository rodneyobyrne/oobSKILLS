# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Use current homepage AI card stylesheet
        run: |
          sed -i "s|/home-ai-review-20260822.css|/home-ai-cards-v3.css?v=${GITHUB_SHA}|" index.html
          grep -F "/home-ai-cards-v3.css?v=${GITHUB_SHA}" index.html
          grep -F "grid-template-columns: 1fr !important" home-ai-cards-v3.css
          grep -F "flex-direction: column !important" home-ai-cards-v3.css
      - name: Verify static homepage hero PNG
        run: |
          file images/ai-relationship/oob-ai-hero.png | grep -F "PNG image data"
          grep -F 'src="/images/ai-relationship/oob-ai-hero.png"' index.html
          ! grep -F 'oob-ai-hero-animated.svg' index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
